<html>
  <head>
      <meta charset="UTF-8">
      <title>برنامه آب و هوا</title>
      <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="card">
      <div class="search">
        <div class="search-box">
          <button><img src="/imgs/search.png"></button>
          <input type="text" placeholder="شهر مورد نظر را وارد کنید.">
        </div>
      </div>

      <div class="location-not-found">
        <h1>شهر مورد نظر پیدا نشد.</h1>
      </div>

      <div class="weather">
        <img src="img/clear.png" class="weather-img">
        <h1 class="temp">17°C</h1>
        <h2 class="city">Tehran</h2>
        <div class="details">
          <div class="col">
            <img src="img/humidity.png" >
            <div>
              <p class="humidity">32%</p>
              <p>رطوبت</p>
            </div>
          </div>
          <div class="col">
            <img src="img/wind.png" >
            <div>
              <p class="wind">3 km/h</p>
              <p>سرعت باد</p>
            </div>
          </div>
        </div>
      </div>

    </div>

    
    <script src="/script.js"></script>
  </body>
</html>
